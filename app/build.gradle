
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ktm.cartoonlivepainter'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ktm.cartoonlivepainter'
        minSdk 23
        targetSdk 35
        versionCode 10
        versionName '10.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
