plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ktm.livepainter'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ktm.livepainter'
        minSdk 23
        targetSdk 35
        versionCode 10
        versionName '10.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
